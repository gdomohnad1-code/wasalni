<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A192F" />
    <title>وصلني — غير متصل</title>
    <link rel="icon" href="/logo.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(1200px 800px at 50% -10%, #12305a 0%, #0A192F 60%);
        color: #E6EEF7;
        display: grid;
        place-items: center;
        padding: 24px;
        min-height: 100vh;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .icon {
        width: 72px; height: 72px;
        margin: 0 auto 16px;
        border-radius: 20px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        color: white;
        font-size: 34px;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
      }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 800; }
      p { margin: 0 0 20px; color: #A9B7C9; line-height: 1.7; font-size: 15px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #10B981; color: white; font-weight: 700;
        padding: 12px 22px; border-radius: 14px;
        font-family: inherit; font-size: 15px;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        transition: transform .15s ease, filter .15s ease;
      }
      button:active { transform: scale(.98); filter: brightness(.95); }
      .hint { margin-top: 14px; font-size: 12px; color: #7c8ba1; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">📶</div>
      <h1>أنت غير متصل بالإنترنت حالياً</h1>
      <p>تعذّر الاتصال بخوادم وصلني. تأكد من اتصالك بالشبكة ثم أعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
      <div class="hint">Wassalni · وضع عدم الاتصال</div>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
